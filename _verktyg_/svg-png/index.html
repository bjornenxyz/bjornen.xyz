<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Converter</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
            --accent: #38bdf8; --btn-h: #0ea5e9; --err: #fb7185;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }
        .container {
            background: var(--card); padding: 2rem; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%; max-width: 450px; text-align: center;
        }
        .upload-btn {
            background: var(--accent); color: #0f172a;
            padding: 12px 24px; border-radius: 8px; cursor: pointer;
            font-weight: 600; display: inline-block; transition: 0.2s;
        }
        .upload-btn:hover { background: var(--btn-h); transform: translateY(-1px); }
        #fileInput { display: none; }
        .preview-box {
            margin: 20px 0; min-height: 150px; border: 2px dashed #334155;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            background: #111827; overflow: hidden;
        }
        #previewImg { max-width: 100%; max-height: 300px; display: none; }
        .controls { display: none; gap: 10px; justify-content: center; margin-top: 20px; }
        .btn {
            background: #334155; color: white; border: none;
            padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
        }
        .btn:hover { background: #475569; }
        #status { margin: 15px 0; font-size: 0.85rem; color: #94a3b8; }
        .error { color: var(--err); }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0">SVG till Bild</h2>
    <label for="fileInput" class="upload-btn">Välj SVG-fil</label>
    <input type="file" id="fileInput" accept=".svg">
    
    <div id="status">Väntar på fil...</div>

    <div class="preview-box">
        <img id="previewImg" alt="Förhandsvisning">
    </div>

    <div class="controls" id="controls">
        <button class="btn" onclick="processDownload('image/png', 'png')">Spara PNG</button>
        <button class="btn" onclick="processDownload('image/jpeg', 'jpg')">Spara JPG</button>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const previewImg = document.getElementById('previewImg');
    const statusDiv = document.getElementById('status');
    const controls = document.getElementById('controls');
    let svgBlobUrl = null;

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        updateStatus("Behandlar fil...");
        
        // Återställ tidigare data
        if (svgBlobUrl) URL.revokeObjectURL(svgBlobUrl);
        previewImg.style.display = 'none';
        controls.style.display = 'none';

        const reader = new FileReader();
        reader.onload = (event) => {
            const svgText = event.target.result;
            const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
            svgBlobUrl = URL.createObjectURL(blob);

            setTimeout(() => {
                previewImg.src = svgBlobUrl;
                previewImg.style.display = 'block';
                controls.style.display = 'flex';
                updateStatus("Klar för nedladdning");
            }, 2000);
        };
        reader.readAsText(file);
    });

    function updateStatus(msg, isError = false) {
        statusDiv.textContent = msg;
        statusDiv.className = isError ? 'error' : '';
    }

    function processDownload(mime, ext) {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            // Säkerställ att vi har dimensioner, annars använd naturlig storlek eller fallback
            canvas.width = img.naturalWidth || 800;
            canvas.height = img.naturalHeight || 600;
            
            const ctx = canvas.getContext('2d');
            
            if (ext === 'jpg') {
                ctx.fillStyle = "white"; // JPG stödjer inte transparens
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            try {
                const dataUrl = canvas.toDataURL(mime, 0.9);
                const link = document.createElement('a');
                link.download = `konverterad.${ext}`;
                link.href = dataUrl;
                link.click();
            } catch (err) {
                updateStatus("Kunde inte skapa bildfilen.", true);
            }
        };
        img.src = svgBlobUrl;
    }
</script>

</body>
</html>
