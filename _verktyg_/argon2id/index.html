<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SHA512 och Argon2ID Lösenord Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html {
  font-family: system-ui;
  font-size: 16px;
  box-sizing: border-box;
}
body {
  background-color: #f8f8f8;
  color: #222;
  padding: 1rem;
}
.generator {
  background-color: #f5f5f5;
  width: 100%;
  max-width: 810px;
  margin: 20px auto;
  padding: 24px 20px 18px 20px;
  border-radius: 3px;
  box-shadow: 0 2px 8px #999;
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.2rem;
}
form#pwForm {
  display: grid;
  gap: 1.2rem;
}
div.password {
  display: grid;
  grid-template-columns: auto min-content min-content;
  gap: 2px;
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 10px;
  align-items: stretch;
}
div.password input[type="password"], div.password input[type="text"] {
  padding: 7px 10px;
  background-color: #ddd;
  border: 0;
  color: #333;
  width: 100%;
  border-radius: 0;
  font-size: 1rem;
}
div.password button {
  border-radius: 0;
  border: 0;
  background-color: #4caf50;
  color: #fff;
  text-transform: uppercase;
  padding: 0 12px;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.2s;
}
div.password button:active {
  background-color: #388e3c;
}
div.range {
  margin: 10px 0;
  display: grid;
  grid-template-columns: 1fr min-content;
  align-items: center;
  gap: 0.5rem;
}
div.range span {
  background-color: #ddd;
  padding: 8px 12px;
  margin-left: 20px;
  min-width: 34px;
  text-align: center;
  border-radius: 3px;
  font-variant-numeric: tabular-nums;
}
div.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 12px 0 10px 0;
}
div.option label {
  display: flex;
  align-items: center;
  background-color: #ddd;
  padding: 9px 6px;
  border-radius: 3px;
  cursor: pointer;
  font-family: sans-serif;
  user-select: none;
  gap: 7px;
}
button.generate {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  background-color: #388e3c;
  color: #fff;
  border: 0;
  border-radius: 3px;
  font-size: 1rem;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s;
}
button.generate:active {
  background-color: #27692a;
}
h2 {
  text-align: center;
  color: #388e3c;
  font-size: 1.2rem;
}
.sr-only {
  position: absolute;
  left: -9999px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}
.hash-block {
  display: flex;
  align-items: center;
  margin-bottom: 12px;
  margin-top: -4px;
  gap: 7px;
}
.hash-block label {
  min-width: 90px;
  font-size: 0.92em;
}
.hash-block input[type="text"] {
  font-size: 0.97em;
  padding: 5px 8px;
  flex: 1 1 auto;
  border-radius: 3px 0 0 3px;
  border: 0;
  background: #eee;
  color: #444;
  margin-right: 0;
}
.hash-block button {
  border-radius: 0 3px 3px 0;
  border: 0;
  background-color: #4caf50;
  color: #fff;
  padding: 0 10px;
  font-size: 0.9em;
  cursor: pointer;
  height: 32px;
  transition: background 0.2s;
}
.hash-block button:active {
  background-color: #388e3c;
}

@media (max-width: 31.25rem) {
  .generator {
    padding: 1rem 0.5rem 1rem 0.5rem;
    margin: 1rem 0;
    box-shadow: none;
    border-radius: 0;
    width: 100%;
    max-width: 100%;
    gap: 0.8rem;
  }
  form#pwForm {
    gap: 0.8rem;
  }
  div.password,
  #argon2id-block,
  #sha512-block,
  .range,
  .options,
  button.generate {
    grid-column: 1 / -1 !important;
    width: 100%;
    max-width: 100%;
  }
  div.password {
    grid-template-columns: 1fr;
    gap: 0.5rem 0;
    margin-bottom: 0.5rem;
    align-items: stretch;
  }
  div.password input {
    border-radius: 3px;
    margin: 0.1rem 0;
    font-size: 1rem;
    width: 100%;
  }
  .password-buttons {
    display: flex;
    flex-direction: row;
    gap: 0.5rem;
    margin-top: 0.3rem;
    width: 100%;
  }
  .password-buttons button#toggleVisibility {
    flex: 0 0 auto;
    width: 2.5em;
    min-width: 2.5em;
    max-width: 2.5em;
    padding: 0;
    justify-content: center;
    text-align: center;
    border-radius: 3px;
    font-size: 1.3em;
  }
  .password-buttons button#copyBtn {
    flex: 1 1 0;
    min-width: 0;
    border-radius: 3px;
    font-size: 1rem;
    margin: 0;
  }
  .hash-block {
    flex-direction: column;
    align-items: stretch;
    gap: 0.25rem;
    margin-bottom: 1rem;
    margin-top: 0;
  }
  .hash-block label {
    min-width: 0;
    margin-bottom: 0.2rem;
  }
  .hash-block input[type="text"],
  .hash-block button {
    border-radius: 3px;
    font-size: 1rem;
    margin-bottom: 0.1rem;
    width: 100%;
    box-sizing: border-box;
  }
  .range {
    grid-template-columns: 1fr;
    gap: 0.25rem;
  }
  .range span {
    margin-left: 0;
    margin-top: 0.2rem;
    border-radius: 3px;
    font-size: 1rem;
  }
  .options {
    grid-template-columns: 1fr;
    gap: 0.5rem;
    margin: 0.7rem 0;
  }
  .option label {
    font-size: 1rem;
    border-radius: 3px;
    padding: 0.7rem 0.5rem;
  }
  button.generate {
    border-radius: 3px;
    font-size: 1.08rem;
    margin-top: 1rem;
    width: 100%;
    display: block;
  }
}
@media (min-width: 31.251rem) {
  .password-buttons {
    display: contents;
  }
}
#verify-block{display:none;}
</style>

<script src="argon2-bundled.min.js"></script>
<script src=" https://cdn.jsdelivr.net/npm/owasp-password-strength-test@1.3.0/owasp-password-strength-test.min.js"></script>
</head>
<body>
<h2>SHA512 och Argon2ID Lösenord Generator</h2>
<main class="generator" aria-label="Lösenords Generator 12-64 tecken med SHA512 och Argon2ID">
  <form id="pwForm" autocomplete="off" onsubmit="return false;">
    <div class="password">
      <input id="passwordField" type="password" value="" title="Genererat lösenord" readonly aria-label="Genererat lösenord" />
      <div class="password-buttons">
        <button id="toggleVisibility" type="button" title="Visa / Dölj lösenordet" aria-label="Visa / Dölj lösenordet">&#128064;</button>
        <button id="copyBtn" type="button" title="Kopiera lösenordet">Kopiera</button>
      </div>
    </div>
    <div id="argon2id-block" class="hash-block" style="display: flex;">
      <label for="argon2idField">Argon2-ID</label>
      <input id="argon2idField" type="text" value="" readonly aria-label="Argon2id hash of password" />
      <button id="copyArgonBtn" type="button" title="Kopiera Argon2ID lösenordet till urklipp">Kopiera</button>
    </div>
    <div id="sha512-block" class="hash-block" style="display: flex;">
      <label for="sha512Field">SHA-512</label>
      <input id="sha512Field" type="text" value="" readonly aria-label="SHA-512 hash av lösenordet" />
      <button id="copyHashBtn" type="button" title="Kopiera SHA-512 hash till urklipp">Kopiera</button>
    </div>
    <div id="verify-block" class="hash-block">
      <label for="verifyField">Verifiering:</label>
      <input id="verifyField" type="text" value="" readonly aria-label="Verifiering av Argon2id hash" />
    </div>
    <div class="range">
      <input id="lenRange" type="range" min="12" max="64" value="12" aria-label="Lösenordets längd" />
      <span id="lenValue">12</span>
    </div>
    <div class="options">
      <div class="option">
        <label for="lowercaseCb">
          <input type="checkbox" id="lowercaseCb" checked />
          <span>små bokstäver</span>
        </label>
      </div>
      <div class="option">
        <label for="uppercaseCb">
          <input type="checkbox" id="uppercaseCb" />
          <span>stora bokstäver</span>
        </label>
      </div>
      <div class="option">
        <label for="digitsCb">
          <input type="checkbox" id="digitsCb" />
          <span>0-9 siffror</span>
        </label>
      </div>
      <div class="option">
        <label for="specialsCb">
          <input type="checkbox" id="specialsCb" />
          <span>!@#$% specialtecken</span>
        </label>
      </div>
    </div>
    <button class="generate" id="generateBtn" type="button">Generera Nytt Lösenord</button>
  </form>
</main>
<script>
function waitForArgon2(callback) {
if (window.argon2 && window.argon2.hash) {
callback();
} else {
setTimeout(() => waitForArgon2(callback), 50);
}
}

document.addEventListener("DOMContentLoaded", function() {
waitForArgon2(() => {
const CHARS = {
lowercase: "abcdefghijklmnopqrstuvwxyz",
uppercase: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
digits: "0123456789",
specials: "!@#$%&*()-_=+[]{};:<>,.?\" ",
};

const pwField = document.getElementById("passwordField");
const lenRange = document.getElementById("lenRange");
const lenValue = document.getElementById("lenValue");
const copyBtn = document.getElementById("copyBtn");
const generateBtn = document.getElementById("generateBtn");
const toggleBtn = document.getElementById("toggleVisibility");
const options = {
lowercase: document.getElementById("lowercaseCb"),
uppercase: document.getElementById("uppercaseCb"),
digits: document.getElementById("digitsCb"),
specials: document.getElementById("specialsCb"),
};
const sha512Field = document.getElementById("sha512Field");
const copyHashBtn = document.getElementById("copyHashBtn");
const argon2idField = document.getElementById("argon2idField");
const copyArgonBtn = document.getElementById("copyArgonBtn");
const verifyField = document.getElementById("verifyField");

async function hashSHA512(str) {
const encoder = new TextEncoder();
const data = encoder.encode(str);
const hashBuffer = await crypto.subtle.digest('SHA-512', data);
return Array.from(new Uint8Array(hashBuffer))
.map(b => b.toString(16).padStart(2, '0'))
.join('');
}

async function hashArgon2id(password, saltStr = "staticSaltForDemo") {
try {
if (typeof argon2 === "undefined" || !argon2.hash) {
return "Argon2ID inte tillgängligt.";
}
const encoder = new TextEncoder();
const salt = encoder.encode(saltStr);
const hash = await argon2.hash({
pass: password,
salt: salt,
time: 2,
mem: 64 * 1024,
hashLen: 32,
parallelism: 1,
type: argon2.ArgonType.Argon2id,
distPath: '',
raw: false
});
return hash.encoded;
} catch (e) {
return "Argon2ID FEL";
}}

async function verifyArgon2id(password, encodedHash) {
try {
await argon2.verify({ pass: password, encoded: encodedHash });
verifyField.value = "Verifiering lyckades!";
} catch (e) {
verifyField.value = "Verifiering misslyckades: " + e.message;
}}

async function generatePassword() {
    let enabledSets = [];
    for (const [key, cb] of Object.entries(options)) {
        if (cb.checked) enabledSets.push(CHARS[key]);
    }
    const len = parseInt(lenRange.value, 10);
    if (!enabledSets.length || len < 1) {
        pwField.value = "";
        sha512Field.value = "";
        argon2idField.value = "";
        verifyField.value = "";
        return;
    }
    let password = [];
    for (const set of enabledSets) {
        password.push(set[crypto.getRandomValues(new Uint32Array(1))[0] % set.length]);
    }
    let idx = 0;
    const setsCount = enabledSets.length;
    const bytes = new Uint32Array(len - password.length);
    crypto.getRandomValues(bytes);
    for (let i = 0; i < bytes.length; i++) {
        const set = enabledSets[idx % setsCount];
        password.push(set[bytes[i] % set.length]);
        idx++;
    }
    for (let i = password.length - 1; i > 0; i--) {
        const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
        [password[i], password[j]] = [password[j], password[i]];
    }
    const finalPass = password.join("");
    pwField.value = finalPass;

    if (finalPass) {
        argon2idField.value = "Laddar...";
        sha512Field.value = "Laddar...";
        const argonHash = await hashArgon2id(finalPass, "staticSaltForDemo");
        argon2idField.value = argonHash;
        const sha512 = await hashSHA512(finalPass);
        sha512Field.value = sha512;

        await verifyArgon2id(finalPass, argonHash);

        const result = passwordStrength(finalPass);
        console.log(result);
        console.log(`Lösenordets poäng: ${result.score}`);
        console.log(`Feedback: ${result.feedback}`);
        
        if (result.score < 3) {
            console.log("Lösenordet är svagt och kan knäckas snabbt.");
        } else if (result.score === 3) {
            console.log("Lösenordet är medelstarkt.");
        } else {
            console.log("Lösenordet är starkt och tar lång tid att knäcka.");
        }
    } else {
        argon2idField.value = "";
        sha512Field.value = "";
        verifyField.value = "";
    }
}

function bindEvents() {
Object.values(options).forEach(cb => cb.addEventListener("change", generatePassword));
lenRange.addEventListener("input", () => {
lenValue.textContent = lenRange.value;
generatePassword();
});
generateBtn.addEventListener("click", generatePassword);

copyBtn.addEventListener("click", async () => {
if (!pwField.value) return;
try {
await navigator.clipboard.writeText(pwField.value);
copyBtn.textContent = "Kopierat";
setTimeout(() => copyBtn.textContent = "Kopiera", 1200);
} catch {
copyBtn.textContent = "Fel";
setTimeout(() => copyBtn.textContent = "Kopiera", 1200);
}});

copyArgonBtn.addEventListener("click", async () => {
if (!argon2idField.value || argon2idField.value === "Laddar..." || argon2idField.value === "Argon2ID inte tillgängligt." || argon2idField.value === "Argon2id error") return;
try {
await navigator.clipboard.writeText(argon2idField.value);
copyArgonBtn.textContent = "Kopierat";
setTimeout(() => copyArgonBtn.textContent = "Kopiera", 1200);
} catch {
copyArgonBtn.textContent = "Fel";
setTimeout(() => copyArgonBtn.textContent = "Kopiera", 1200);
}
});

copyHashBtn.addEventListener("click", async () => {
if (!sha512Field.value || sha512Field.value === "Loading...") return;
try {
await navigator.clipboard.writeText(sha512Field.value);
copyHashBtn.textContent = "Kopierat";
setTimeout(() => copyHashBtn.textContent = "Kopiera", 1200);
} catch {
copyHashBtn.textContent = "Fel";
setTimeout(() => copyHashBtn.textContent = "Kopiera", 1200);
}
});

toggleBtn.addEventListener("click", () => {
if (pwField.type === "password") {
pwField.type = "text";
toggleBtn.innerHTML = "&#128065;";
} else {
pwField.type = "password";
toggleBtn.innerHTML = "&#128064;";
}
});
document.getElementById("pwForm").addEventListener("submit", e => e.preventDefault());
pwField.addEventListener("focus", () => pwField.select());
}

options.lowercase.checked = true;
options.uppercase.checked = false;
options.digits.checked = false;
options.specials.checked = false;
lenRange.min = 12;
lenRange.max = 64;
if (parseInt(lenRange.value, 10) < 12) lenRange.value = 12;
if (parseInt(lenRange.value, 10) > 64) lenRange.value = 64;
lenValue.textContent = lenRange.value;
bindEvents();
generatePassword();
});
});
</script>
</body>
</html>
