<html lang="sv">
<head>
<meta charset="UTF-8">

<title>CRM System</title>
<style>
:root {
--primary: #4f46e5;
--primary-hover: #4338ca;
--primary-light: #e0e7ff;
--bg-main: #f8fafc;
--bg-sidebar: #0f172a;
--bg-sidebar-hover: #1e293b;
--text-dark: #0f172a;
--text-muted: #64748b;
--border-color: #e2e8f0;
--white: #ffffff;
--success: #10b981;
--success-bg: #ecfdf5;
--warning: #f59e0b;

--danger: #ef4444;

--radius-md: 8px;

* {

margin: 0;

body {

}}

bottom: 0;

.sidebar.open {

}

@media (min-width: 768px) {

}}

.sidebar-brand {

gap: 12px;

}

.nav-menu {

.nav-btn {

background: transparent;

.sidebar-footer {

.file-label {

</head>

<script>
const DB_NAME = 'CRM_DB';
const DB_VERSION = 1;
const STORE_NAME = 'clients';
let db = null;

function initDB() {
return new Promise((resolve, reject) => {
const request = indexedDB.open(DB_NAME, DB_VERSION);
request.onerror = (event) => reject(event.target.error);
request.onsuccess = (event) => {
db = event.target.result;
resolve(db);
};
request.onupgradeneeded = (event) => {
const database = event.target.result;
if (!database.objectStoreNames.contains(STORE_NAME)) {
database.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
}};
});
}

function getAllClients() {
return new Promise((resolve, reject) => {
const transaction = db.transaction([STORE_NAME], 'readonly');
const store = transaction.objectStore(STORE_NAME);
const request = store.getAll();
request.onsuccess = () => resolve(request.result);
request.onerror = () => reject(request.error);
});
}
function saveClient(client) {
return new Promise((resolve, reject) => {
const transaction = db.transaction([STORE_NAME], 'readwrite');
const store = transaction.objectStore(STORE_NAME);
if (client.id) {
client.id = parseInt(client.id, 10);
} else {
delete client.id;
}
const request = store.put(client);
request.onsuccess = () => resolve(request.result);
request.onerror = () => reject(request.error);
});
}

function deleteClient(id) {
return new Promise((resolve, reject) => {
const transaction = db.transaction([STORE_NAME], 'readwrite');
const store = transaction.objectStore(STORE_NAME);
const request = store.delete(parseInt(id, 10));
request.onsuccess = () => resolve();
request.onerror = () => reject(request.error);
});
}

function clearAllClients() {
return new Promise((resolve, reject) => {
const transaction = db.transaction([STORE_NAME], 'readwrite');
const store = transaction.objectStore(STORE_NAME);
const request = store.clear();
request.onsuccess = () => resolve();
request.onerror = () => reject(request.error);
});
}

function showDeleteToast(clientName, onConfirm) {
let container = document.getElementById('toast-container');
if (!container) {
container = document.createElement('div');
container.id = 'toast-container';
container.className = 'toast-container';
document.body.appendChild(container);
}

const toast = document.createElement('div');
toast.className = 'toast';
toast.innerHTML = `
<div class="toast-header">Bekräfta radering</div>
<div class="toast-body">Är du säker på att du vill ta bort ${clientName}?</div>
<div class="toast-actions">
<button class="toast-btn toast-btn-cancel" id="toast-cancel">Avbryt</button>
<button class="toast-btn toast-btn-confirm" id="toast-confirm">Ja, radera</button>
</div>
`;

container.appendChild(toast);
setTimeout(() => toast.classList.add('show'), 10);

const removeToast = () => {
toast.classList.remove('show');
setTimeout(() => toast.remove(), 300);
};

toast.querySelector('#toast-confirm').addEventListener('click', () => {
onConfirm();
removeToast();
});

toast.querySelector('#toast-cancel').addEventListener('click', removeToast);
}
const tableBody = document.getElementById('client-table-body');
const emptyState = document.getElementById('empty-state');
const statTotal = document.getElementById('stat-total');
const statActive = document.getElementById('stat-active');
const statLead = document.getElementById('stat-lead');
const statInactive = document.getElementById('stat-inactive');
let cachedClients = [];

async function renderDashboard() {
try {
cachedClients = await getAllClients();
const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
const filteredClients = cachedClients.filter(client => {
const firstName = (client.firstname || '').toLowerCase();
const lastName = (client.lastname || '').toLowerCase();
const company = (client.company || '').toLowerCase();
const email = (client.email || '').toLowerCase();
const fullName = `${firstName} ${lastName}`;

return firstName.includes(searchQuery) || 
lastName.includes(searchQuery) || 
fullName.includes(searchQuery) ||
company.includes(searchQuery) || 
email.includes(searchQuery);
});

updateStats(cachedClients);

if (filteredClients.length === 0) {
tableBody.innerHTML = '';
emptyState.classList.remove('hidden');
return;
}

emptyState.classList.add('hidden');
tableBody.innerHTML = filteredClients.map(client => {
const statusClass = (client.status || 'Aktiv').toLowerCase();
return `
<tr>
<td>
<div class="client-meta">
<h4>${client.firstname} ${client.lastname}</h4>
<p>${client.email}</p>
</div>
</td>
<td style="font-weight: 500; color: #334155;">${client.company}</td>
<td>
<span class="status-badge ${statusClass}">
${client.status}
</span>
</td>
<td style="color: var(--text-muted); font-size: 12px;">${client.updatedAt || 'Ingen historik'}</td>
<td style="color: var(--text-muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${client.notes || ''}">
${client.notes || '-'}
</td>
<td class="actions-cell">
<button onclick="editClientTrigger(${client.id})" class="action-btn edit">Redigera</button>
<button onclick="deleteClientTrigger(${client.id}, '${client.firstname} ${client.lastname}')" class="action-btn delete">Radera</button>
</td>
</tr>
`;
}).join('');
} catch (err) {
console.error(err);
}}

function updateStats(clients) {
statTotal.textContent = clients.length;
statActive.textContent = clients.filter(c => c.status === 'Aktiv').length;
statLead.textContent = clients.filter(c => c.status === 'Prospekt').length;
statInactive.textContent = clients.filter(c => c.status === 'Inaktiv').length;
}
const modalOverlay = document.getElementById('modal-overlay');
const modalTitle = document.getElementById('modal-title');
const crmForm = document.getElementById('crm-form');
const inputId = document.getElementById('client-id');
const inputFirstname = document.getElementById('client-firstname');
const inputLastname = document.getElementById('client-lastname');
const inputCompany = document.getElementById('client-company');
const inputEmail = document.getElementById('client-email');
const inputPhone = document.getElementById('client-phone');
const inputStatus = document.getElementById('client-status');
const inputNotes = document.getElementById('client-notes');
const sidebarMenu = document.getElementById('sidebar-menu');
const btnMenuToggle = document.getElementById('btn-menu-toggle');
const btnMenuClose = document.getElementById('btn-menu-close');

function openModal(title, client = null) {
modalTitle.textContent = title;
crmForm.reset();
inputId.value = '';
if (client) {
inputId.value = client.id;
inputFirstname.value = client.firstname;
inputLastname.value = client.lastname;
inputCompany.value = client.company;
inputEmail.value = client.email;
inputPhone.value = client.phone;
inputStatus.value = client.status;
inputNotes.value = client.notes;
}
modalOverlay.classList.add('open');
}

function closeModal() {
modalOverlay.classList.remove('open');
crmForm.reset();
inputId.value = '';
}

window.editClientTrigger = function(id) {
const client = cachedClients.find(c => c.id === id);
if (client) openModal('Redigera kontakt', client);
};

window.deleteClientTrigger = function(id, fullName) {
showDeleteToast(fullName, async () => {
await deleteClient(id);
renderDashboard();
});
};

btnMenuToggle.addEventListener('click', (e) => { e.stopPropagation(); sidebarMenu.classList.add('open'); });
btnMenuClose.addEventListener('click', (e) => { e.stopPropagation(); sidebarMenu.classList.remove('open'); });
document.addEventListener('click', (e) => {
if (window.innerWidth < 768 && sidebarMenu.classList.contains('open')) {
if (!sidebarMenu.contains(e.target) && e.target !== btnMenuToggle) {
sidebarMenu.classList.remove('open');
}}});
document.getElementById('btn-export').addEventListener('click', async () => {
try {
const clients = await getAllClients();
const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(clients, null, 2));
const downloadAnchor = document.createElement('a');
downloadAnchor.setAttribute("href", dataStr);
downloadAnchor.setAttribute("download", `crm_export.json`);
document.body.appendChild(downloadAnchor);
downloadAnchor.click();
downloadAnchor.remove();
} catch (err) {
console.error(err);
}});

document.getElementById('file-import').addEventListener('change', function(e) {
const reader = new FileReader();
reader.onload = async function(event) {
try {
const importedData = JSON.parse(event.target.result);
if (Array.isArray(importedData)) {
if (confirm('Vill du skriva över den nuvarande databasen med den här JSON-filen?')) {
await clearAllClients();
for (const client of importedData) {
delete client.id;
await saveClient(client);
}
renderDashboard();
}} else {
alert('Felaktigt JSON-format.');
}} catch (err) {
alert('Det gick inte att tolka filen.');
}};
if (e.target.files.length > 0) { reader.readAsText(e.target.files); }
this.value = '';
});

crmForm.addEventListener('submit', async (e) => {
e.preventDefault();
const timestamp = new Date().toLocaleDateString('sv-SE', {
year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
});
const clientData = {
firstname: inputFirstname.value.trim(),
lastname: inputLastname.value.trim(),
company: inputCompany.value.trim(),
email: inputEmail.value.trim(),
phone: inputPhone.value.trim(),
status: inputStatus.value,
notes: inputNotes.value.trim(),
updatedAt: timestamp
};
if (inputId.value) { clientData.id = inputId.value; }
try {
await saveClient(clientData);
closeModal();
renderDashboard();
} catch (err) { console.error(err); }
});

document.getElementById('btn-open-add').addEventListener('click', () => openModal('Lägg till ny kontakt'));
document.getElementById('btn-close-modal').addEventListener('click', closeModal);
document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
document.getElementById('search-input').addEventListener('input', renderDashboard);
document.querySelectorAll('.sidebar .nav-btn, .sidebar .file-label').forEach(el => {
el.addEventListener('click', () => { if (window.innerWidth < 768) sidebarMenu.classList.remove('open'); });
});
window.addEventListener('resize', () => { if (window.innerWidth >= 768) sidebarMenu.classList.remove('open'); });
window.addEventListener('DOMContentLoaded', async () => {
try { await initDB(); renderDashboard(); } catch (err) { console.error(err); }
});
</script>
</body>
</html>
