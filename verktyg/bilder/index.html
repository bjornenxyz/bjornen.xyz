<!DOCTYPE html>

<style>
        * {

        .update-notice-close {

            color: #fafafa;

        }
        
        .upload-area {

        }
        
        input[type="file"] {

        }
        
        .progress-container {

        .progress-bar {

	        border: 2px solid #667eea;

		.delete-btn {
            background: #0f1724;
            color: #fafafa;
			padding: 10px 20px;

            font-weight: 300;

		}
		
		.delete-btn .ikon {

		}
		
		.delete-btn .ikon:hover {

            gap: 10px;

            border-radius: 10px;

            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
            flex: 1;
            display: none;

        .confirm-btn.show {

        }

            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
            flex: 1;
            display: none;

        .cancel-btn.show {
            display: block;
        }
        
        .cancel-btn:hover {
            background: #0f1724;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(107, 114, 128, 0.4);

        .batch-download {
            margin-top: 0;

            background: #0f1724;
            border-radius: 10px;

        .batch-controls {

            justify-content: space-between;

        .batch-title {

            color: #fafafa;

        }
        
        .batch-download-btn {
            background: #0f1724;
            color: #fafafa;
            border: 2px solid #fafafa;
            padding: 12px 30px;
            border-radius: 4px;

        @media (max-width: 768px) {

		.total-stats{margin:1rem 0; font-size: 0.8rem;}
		.total-stats .hundra{display:inline-block;font-size:1.5rem;margin-right:0.5rem;padding:0.5rem;}
    </style>
</head>
<body>
    <!-- notis -->
    <div class="update-notice" id="updateNotice">
        <div class="update-notice-text" id="updateNoticeText"></div>
        <button class="update-notice-close" onclick="dismissUpdateNotice()">×</button>
    </div>

    <div class="container">
        <h1>💣 PNG, JPG/JPEG + WebP optimering</h1>
        
        <div class="slider-container">
            <div class="slider-label">
                <span>Procentuell Optimeringsnivå</span>
                <span class="slider-value" id="sliderValue">50%</span>
            </div>
            <input type="range" id="qualitySlider" min="1" max="100" value="50">
<button class="reoptimize-all-btn" id="reoptimizeAllBtn" onclick="reoptimizeAllImages()">🪄 Optimera Igen</button>
        </div>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">🪓</div>
            <div class="upload-text">Välj bild(er)</div>
            <div class="upload-subtext"><em><strong>eller:</strong></em> dra och släpp bild(er) hit</div>
        </div>
        
        <input type="file" id="fileInput" multiple accept="image/png,image/jpeg,image/jpg,image/webp">
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
        </div>
        
        <div class="results-container" id="resultsContainer">
            <div id="resultsList"></div>
            
            <div class="reset-container">
                <button class="reset-btn" id="resetBtn" onclick="showResetConfirmation()">🔥 Rensa &amp; Starta Om</button>
                <button class="confirm-btn" id="confirmResetBtn" onclick="confirmReset()">✅ Ja, rensa</button>
                <button class="cancel-btn" id="cancelResetBtn" onclick="cancelReset()">❌ Avbryt</button>
            </div>
            
            <div class="batch-download">
                <div class="batch-controls">
                    <div class="batch-title">Spara</div>
                    <button class="batch-download-btn" id="batchDownloadBtn">🔬 Spara ZIP</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>		
        // bibliotek att hålla koll på (version)
        const LIBRARY_VERSIONS = {
            'jszip': {
                url: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
                version: '3.10.1',
                checkUrl: 'https://api.cdnjs.com/libraries/jszip'
            },
            'filesaver': {
                url: 'https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js',
                version: '2.0.5',
                checkUrl: 'https://api.cdnjs.com/libraries/FileSaver.js'
            },
            'pako': {
                url: 'https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js',
                version: '2.1.0',
                checkUrl: 'https://api.cdnjs.com/libraries/pako'
            }
        };
        
        // globala variablar
        let optimizedImages = [];
        let qualityValue = 50;
        let initialQualityValue = 50;
        let db;
        
        // DOM element
        const slider = document.getElementById('qualitySlider');
        const sliderValue = document.getElementById('sliderValue');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsList = document.getElementById('resultsList');
        const batchDownloadBtn = document.getElementById('batchDownloadBtn');
        const reoptimizeAllBtn = document.getElementById('reoptimizeAllBtn');
		const DB_NAME = 'BildOptDB';
		const DB_VERSION = 2;
		
		// funktioner för ZIP-arkivens namn
		function getNextZipName(base = 'optimerade_bilder.zip') {
		    const stored = localStorage.getItem('zipCounter');
		    const count = stored ? Number(stored) + 1 : 1;
		    localStorage.setItem('zipCounter', count);
		    return base.replace('.zip', `_${count}.zip`);
		}

		function buildOptimizedFileName(originalName, quality) {
		    const dot = originalName.lastIndexOf('.');
		    const base = originalName.substring(0, dot);
		    const ext = originalName.substring(dot);
		    return `optimerad_${quality}_${base}${ext}`;
		}
        
        // dra igång så vi kommer nånvart... IndexedDB!
        function initIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('BildOptDB', 2);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                
                request.onupgradeneeded = (event) => {
                    db = event.target.result;
                    
                    if (!db.objectStoreNames.contains('libraries')) {
                        db.createObjectStore('libraries', { keyPath: 'name' });
                    }
                    
                    if (!db.objectStoreNames.contains('settings')) {
                        db.createObjectStore('settings', { keyPath: 'key' });
                    }
					
				    if (!db.objectStoreNames.contains('pages')) {
				        db.createObjectStore('pages', { keyPath: 'path' });
				    }
                };
            });
        }
        
		async function ensurePersistentStorage() {
		    if (navigator.storage && navigator.storage.persisted) {
		        const alreadyPersisted = await navigator.storage.persisted();
		        if (alreadyPersisted) {
		            console.log(`✅ IDB-lagring aktiverad.`);
		            return true;
		        }
		    }

		    if (navigator.storage && navigator.storage.persist) {
		        const granted = await navigator.storage.persist();
		        if (granted) {
		            console.log(`✅ IDB-lagring beviljad. Sidan körs nu offline.`);
		        } else {
		            console.warn(`⚠️ IDB-lagring nekades.`);
		        }
		        return granted;
		    }

		    console.warn(`⚠️ Webbläsaren saknar nödvändligt API.`);
		    return false;
		}
		
		function storePage(path, html) {
	       return new Promise((resolve, reject) => {
	           const tx = db.transaction(['pages'], 'readwrite');
	           const store = tx.objectStore('pages');
	           store.put({ path, html, savedAt: Date.now() });
	           tx.oncomplete = () => resolve();
	           tx.onerror = () => reject(tx.error);
	       });
	   }
	   
	   function getStoredPage(path) {
	       return new Promise((resolve, reject) => {
	           const tx = db.transaction(['pages'], 'readonly');
	           const store = tx.objectStore('pages');
	           const req = store.get(path);
	           req.onsuccess = () => resolve(req.result ? req.result.html : null);
	           req.onerror = () => reject(req.error);
	       });
	   }
	   
	   (async () => {
	       if (!navigator.onLine) {
	           const cached = await getStoredPage('/bilder.html');
	           if (cached) {
	               document.open();
	               document.write(cached);
	               document.close();
	               console.log(`Webbsidan körs lokalt från IDB.`);
	               return;
	           }
	           console.warn(`Webbplatsen ej cachad.`);
	           return;
	       }

	   })();

        // ladda bibliotek från CDN och cache
        async function loadLibrary(name, url, currentVersion) {
            try {
                const transaction = db.transaction(['libraries'], 'readonly');
                const store = transaction.objectStore('libraries');
                const request = store.get(name);
                
                return new Promise((resolve, reject) => {
                    request.onsuccess = () => {
                        if (request.result && request.result.code && request.result.version === currentVersion) {
                            // ladda från cache
                            const script = document.createElement('script');
                            script.textContent = request.result.code;
                            document.head.appendChild(script);
                            console.log(`Använder cachad v${currentVersion} av ${name} från IDB.`);
                            resolve();
                        } else {
                            // ladda från CDN och cache
                            fetch(url)
                                .then(response => response.text())
                                .then(code => {
                                    // cacha koden
                                    const transaction = db.transaction(['libraries'], 'readwrite');
                                    const store = transaction.objectStore('libraries');
                                    store.put({
                                        name: name,
                                        code: code,
                                        url: url,
                                        version: currentVersion,
                                        cachedAt: Date.now()
                                    });
                                    
                                    // kör motorn tills det tar slut
                                    const script = document.createElement('script');
                                    script.textContent = code;
                                    document.head.appendChild(script);
                                    console.log(`Använder cachad v${currentVersion} av ${name} från IDB.`);
                                    resolve();
                                })
                                .catch(reject);
                        }
                    };
                    
                    request.onerror = () => {
                        // fallback till CDN
                        const script = document.createElement('script');
                        script.src = url;
                        script.onload = resolve;
                        script.onerror = reject;
                        document.head.appendChild(script);
                    };
                });
            } catch (error) {
                // fallback till vanligt script lösning
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = url;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }
        }
        
        // bibliotek - finns det nya versioner? KOLLA
        async function checkForUpdates() {
            if (!db) return;
            
            const transaction = db.transaction(['settings'], 'readonly');
            const store = transaction.objectStore('settings');
            const request = store.get('lastUpdateCheck');
            
            return new Promise((resolve) => {
                request.onsuccess = async () => {
                    const lastCheck = request.result ? request.result.value : 0;
                    const oneWeek = 7 * 24 * 60 * 60 * 1000;
                    
                    if (Date.now() - lastCheck > oneWeek) {
                        const updates = [];
                        
                        for (const [name, lib] of Object.entries(LIBRARY_VERSIONS)) {
                            try {
                                const response = await fetch(lib.checkUrl);
                                const data = await response.json();
                                const latestVersion = data.version;
                                
                                if (latestVersion && latestVersion !== lib.version) {
                                    updates.push({ name, current: lib.version, latest: latestVersion });
                                    
                                    // hämta och cacha ny version automatiskt
                                    const newUrl = lib.url.replace(lib.version, latestVersion);
                                    try {
                                        const codeResponse = await fetch(newUrl);
                                        const code = await codeResponse.text();
                                        
                                        const updateTransaction = db.transaction(['libraries'], 'readwrite');
                                        const updateStore = updateTransaction.objectStore('libraries');
                                        updateStore.put({
                                            name: name,
                                            code: code,
                                            url: newUrl,
                                            version: latestVersion,
                                            cachedAt: Date.now()
                                        });
                                        
                                        console.log(`Hämtat och cachat v${latestVersion} av ${name}.`);
                                        
                                        // uppdatera LIBRARY_VERSIONS
                                        LIBRARY_VERSIONS[name].version = latestVersion;
                                        LIBRARY_VERSIONS[name].url = newUrl;
                                    } catch (error) {
                               console.error(`Hämtning av ${name} v${latestVersion} misslyckades: `, error);
                                    }
                                }
                            } catch (error) {
                                console.error(`Versionskontrollen av ${name} gick fel: `, error);
                            }
                        }
                        
                        const updateTransaction = db.transaction(['settings'], 'readwrite');
                        const updateStore = updateTransaction.objectStore('settings');
                        updateStore.put({ key: 'lastUpdateCheck', value: Date.now() });
                        
                        if (updates.length > 0) {
                            showUpdateNotice(updates);
                        }
                    }
                    
                    resolve();
                };
                
                request.onerror = () => resolve();
            });
        }
        
		function showUpdateNotice(updates) {
		    const transaction = db.transaction(['settings'], 'readonly');
		    const store = transaction.objectStore('settings');
		    const request = store.get('updateNoticeDismissed');
		    request.onsuccess = () => {
		        const dismissed = request.result ? request.result.value : false;
		        if (dismissed) return;
		        const notice = document.getElementById('updateNotice');
		        const text = document.getElementById('updateNoticeText');
		        let message = '';
		        if (updates.length === 1) {
		            const u = updates[0];
		            const libInfo = `${u.name}: ${u.current} → ${u.latest}`;
		            message = `🔔 Ny version av ${libInfo} hämtad och cachad. IDB uppdaterad.`;
		        }
		        else {

        async function handleFiles(files) {

                const file = imageFiles[i];

                progressFill.style.width = progress + '%';
                progressFill.textContent = Math.round(progress) + '%';
                
                try {

		async function optimizeImage(file, shouldLog = true) {
		    if (shouldLog) {
		        console.log(`Optimerar ${file.name} (${file.type}) med ${qualityValue}%`);
		    }
		    if (file.type === 'image/png') {
		        return await optimizePNG(file);
		    } else if (file.type === 'image/jpeg' || file.type === 'image/jpg') {
		        return await optimizeJPEG(file);
		    } else if (file.type === 'image/webp') {
		        return await optimizeWebP(file);
		    }
		}
		
		function round2(num) {
		    return Math.round(num * 100) / 100;
		}
		
		function formatFileSize(bytes) {
		    if (bytes === 0) return '0 Bytes';
		    const k = 1024;
		    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
		    const i = Math.floor(Math.log(bytes) / Math.log(k));
		    return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
		}

		function formatSavedSize(kb) {
		    const mb = kb / 1024;
		    const mbStr = (Math.round(mb * 100) / 100).toLocaleString(undefined, {
		        minimumFractionDigits: 2,
		        maximumFractionDigits: 2
		    });
		    const kbStr = Math.round(kb).toLocaleString();
		    return `${mbStr}\u00A0MB = ${kbStr}\u00A0KB`;
		}
		
        async function optimizePNG(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                
                reader.onload = async function(e) {
                    const img = new Image();
                    
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        
                        // hämta bild och data
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imageData.data;
                        
                        // färgkorrigering baserat på kvalite
                        const colorReduction = Math.floor((100 - qualityValue) / 10);
                        if (colorReduction > 0) {
                            for (let i = 0; i < data.length; i += 4) {
                                const factor = Math.pow(2, colorReduction);
                                data[i] = Math.round(data[i] / factor) * factor;
                                data[i + 1] = Math.round(data[i + 1] / factor) * factor;
                                data[i + 2] = Math.round(data[i + 2] / factor) * factor;
                            }
                            ctx.putImageData(imageData, 0, 0);
                        }
                        
                        // konvertera till PNG blob
                        canvas.toBlob(function(blob) {
                            if (!blob) {
                                resolve({
                                    originalFile: file,
                                    compressedFile: file,
                                    originalSize: file.size,
                                    compressedSize: file.size,
                                    reduction: '0.0',
                                    optimizedQuality: qualityValue
                                });
                                return;
                            }
                            
                            let finalFile = blob;
                            let finalSize = blob.size;
                            let reduction = ((file.size - blob.size) / file.size * 100);
                            
                            if (blob.size >= file.size) {
                                finalFile = file;
                                finalSize = file.size;
                                reduction = 0;
                            } else {
                                finalFile = new File([blob], file.name, { type: 'image/png' });
                            }
                            
console.log(`PNG Result: ${formatFileSize(file.size)} → ${formatFileSize(finalSize)} (${reduction.toFixed(1)}%)`);
                            
							resolve({
							    originalFile: file,
							    compressedFile: finalFile,
							    originalSize: file.size,
							    compressedSize: finalSize,
							    reduction: round2(reduction),
							    savedKB: round2((file.size - finalSize) / 1024),
							    optimizedQuality: qualityValue
							});
                        }, 'image/png');
                    };
                    
                    img.onerror = () => reject(new Error('Kunde inte ladda PNG.'));
                    img.src = e.target.result;
                };
                
                reader.onerror = () => reject(new Error('Kunde inte läsa PNG-bilden.'));
                reader.readAsDataURL(file);
            });
        }

		function updateTotalStats(isReopt = false) {
		    const totalFiles = optimizedImages.length;
		    const totalOriginal = optimizedImages.reduce((s, i) => s + i.originalSize, 0);
		    const totalCompressed = optimizedImages.reduce((s, i) => s + i.compressedSize, 0);
		    const totalSavedKB = round2((totalOriginal - totalCompressed) / 1024);
		    const totalReduction = round2((totalOriginal - totalCompressed) / totalOriginal * 100);

		    let statsEl = document.getElementById('totalStats');
		    if (!statsEl) {
		        statsEl = document.createElement('div');
		        statsEl.id = 'totalStats';
		        statsEl.style.marginTop = '10px';
		        statsEl.style.fontSize = '0.95rem';
		        statsEl.style.color = '#fafafa';
		        document.querySelector('.batch-download').appendChild(statsEl);
		    }
			
			if (isReopt) {
			    // meddelande då samma bild(er) optimeras igen
			    const fileText = totalFiles === 1 ? "bild" : "bilder";
			    statsEl.innerHTML = `<p class="total-stats"><span class="hundra">💯</span> 
				<strong>${totalFiles}</strong> ${fileText}</p>`;

			    // andra och tredje paragrafen
			    statsEl.innerHTML += `<p>Med kvaliten ändrad till ${qualityValue}% har ${formatFileSize(totalOriginal)} 
				minskat till ${formatFileSize(totalCompressed)} (${totalReduction}%).</p>`;
				statsEl.innerHTML += `<p>Du sparar nu totalt ${totalSavedKB} KB! 
				<strong>Glöm inte lazy‑loading i din kod.</strong></p>`;
			
			} else {
			    // meddelande efter första optimeringen
			    const fileText = totalFiles === 1 ? "bild optimerad" : "bilder optimerade";
			    statsEl.innerHTML = `<p class="total-stats"><span class="hundra">💯</span> 
				<strong>${totalFiles}</strong> ${fileText}</p>`;
				
				statsEl.innerHTML += `<p>Från ${formatFileSize(totalOriginal)} till ${formatFileSize(totalCompressed)} 
				är en minskning med ${totalReduction}%</p>`;
				
				// andra paragrafen
				statsEl.innerHTML += `<p>Du sparar ${totalSavedKB} KB. 
				<strong>Glöm inte lazy‑loading i din kod.</strong></p>`;
			}
		}

Samma bilder optimeras igen med ${qualityValue}%

`);

		    progressContainer.style.display = 'none';
		    initialQualityValue = qualityValue;
		    reoptimizeAllBtn.classList.remove('show');
		    displayResults();
		    updateTotalStats(true);
		}
				
		function removeImage(imgObj, rowEl) {
		    const idx = optimizedImages.indexOf(imgObj);
		    if (idx > -1) {
		        optimizedImages.splice(idx, 1);
		    }

		    if (rowEl && rowEl.parentNode) {
		        rowEl.parentNode.removeChild(rowEl);
		    }

		    updateTotalStats();
		}
		
        function displayResults() {
            resultsContainer.style.display = 'block';
            resultsList.innerHTML = '';
            
            optimizedImages.forEach((img, index) => {
                const item = document.createElement('div');
                item.className = 'result-item';
                
                const info = document.createElement('div');
                info.className = 'result-info';
                
                const filename = document.createElement('div');
                filename.className = 'result-filename';
                filename.textContent = img.originalFile.name;
                
                const sizeInfo = document.createElement('div');
                sizeInfo.className = 'result-size';
			sizeInfo.innerHTML = `${formatFileSize(img.originalSize)} → ${formatFileSize(img.compressedSize)}
			    <span class="size-reduction"> = ${img.reduction}% = ${formatSavedSize(img.savedKB)}</span>`;
                
                info.appendChild(filename);
                info.appendChild(sizeInfo);
                
                const actions = document.createElement('div');
                actions.className = 'result-actions';
                
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'download-btn';
                downloadBtn.textContent = 'Spara';
                downloadBtn.onclick = () => downloadSingleImage(img);
                actions.appendChild(downloadBtn);
				
		        const deleteBtn = document.createElement('button');
		        deleteBtn.className = 'delete-btn';
		        deleteBtn.textContent = '🗑️';
		        deleteBtn.onclick = () => removeImage(img, item);
		        actions.appendChild(deleteBtn);
                
                item.appendChild(info);
                item.appendChild(actions);
                resultsList.appendChild(item);
            });
			
			updateTotalStats();
        }
		
		function downloadSingleImage(img) {
		    const name = buildOptimizedFileName(img.originalFile.name, img.optimizedQuality);
		    const url = URL.createObjectURL(img.compressedFile);
		    const a = document.createElement('a');
		    a.href = url;
		    a.download = name;
		    document.body.appendChild(a);
		    a.click();
		    document.body.removeChild(a);
		    URL.revokeObjectURL(url);
		}

		async function downloadAsZip() {
		    const zip = new JSZip();
		    for (const img of optimizedImages) {
		        zip.file('optimerad_' + img.originalFile.name, img.compressedFile);
		    }
		    const content = await zip.generateAsync({type: 'blob'});
		    const zipName = getNextZipName();
		    saveAs(content, zipName);
		}
