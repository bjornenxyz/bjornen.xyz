<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skrivhastighet, Statistik och Historik</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
		
        body {
            font-family: system-ui, Arial, sans-serif;
            background-color: #1e293b;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            @media (max-width: 640px) {
                padding: 1rem 0.5rem;
            }
        }
        
		.app-container {
            width: 100%;
            max-width: 62.5rem;
            background-color: #0f172a;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid #334155;
        }
        
		.user-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding: 1rem;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            align-items: center;
            @media (max-width: 640px) {
                flex-direction: column;
                align-items: stretch;
            }
        }
        
		.user-input {
            flex: 1;
            min-width: 200px;
            padding: 0.5rem;
            border: 1px solid #475569;
            border-radius: 0.25rem;
            font-size: 1rem;
            background-color: #0f172a;
            color: #f1f5f9;
            outline: none;
            &::placeholder {
                color: #94a3b8;
            }
        }
        
		.btn-action {
            padding: 0.5rem 1rem;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 0.25rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            &:hover {
                background-color: #1d4ed8;
            }
        }
        
		.file-label {
            padding: 0.5rem 1rem;
            background-color: #475569;
            color: #ffffff;
            border-radius: 0.25rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
            &:hover {
                background-color: #334155;
            }
        }
        
		#import-file {
            display: none;
        }
        .text-input {
            width: 100%;
            padding: 1rem;
            border: none;
            outline: none;
            resize: none;
            font-size: 1rem;
            line-height: 1.5;
            color: #f8fafc;
            background-color: #0f172a;
        }
        .stats-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1rem;
            margin-top: 1rem;
            background-color: #1e293b;
            border-top: 1px solid #334155;
            @media (max-width: 640px) {
                gap: 0.75rem;
            }
        }
        .stat-card {
            flex: 1 1 calc(20% - 1rem);
            min-width: 140px;
            padding: 0.75rem;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.25rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            @media (max-width: 640px) {
                flex: 1 1 calc(50% - 0.75rem);
            }
        }
        .stat-label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
        }
        .btn-reset {
            width: 100%;
            height: 100%;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 0.25rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            &:hover {
                background-color: #2563eb;
            }
            @media (max-width: 640px) {
                padding: 0.75rem;
            }
        }
        .btn-danger {
            background-color: #ef4444;
            &:hover {
                background-color: #dc2626;
            }
        }
        .chart-section {
            padding: 1rem;
            background-color: #0f172a;
            border-top: 1px solid #334155;
        }
        .chart-container {
            display: flex;
            align-items: flex-end;
            gap: 0.5rem;
            height: 120px;
            padding-top: 1rem;
            border-bottom: 2px solid #475569;
            overflow-x: auto;
        }
        .chart-bar {
            flex: 1;
            min-width: 30px;
            max-width: 60px;
            background-color: #3b82f6;
            border-radius: 0.25rem 0.25rem 0 0;
            position: relative;
            transition: height 0.3s;
            &:hover {
                background-color: #38bdf8;
                .chart-tooltip {
                    display: block;
                }
            }
        }
        .chart-tooltip {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #1e293b;
            color: #fff;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            white-space: nowrap;
            border: 1px solid #475569;
            z-index: 10;
        }
        .history-container {
            padding: 1rem;
            background-color: #0f172a;
            border-top: 1px solid #334155;
        }
        .history-title {
            font-size: 1rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.75rem;
        }
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
            th {
                background-color: #1e293b;
                color: #94a3b8;
                padding: 0.75rem;
                cursor: pointer;
                user-select: none;
                border-bottom: 2px solid #334155;
                &:hover {
                    color: #f1f5f9;
                    background-color: #334155;
                }
            }
            td {
                padding: 0.75rem;
                border-bottom: 1px solid #1e293b;
                color: #cbd5e1;
            }
            tr {
                &:hover {
                    background-color: #1e293b;
                }
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="user-container">
            <input type="text" id="username" class="user-input" placeholder="Namn (krävs för att spara)" />
            <button id="export-btn" class="btn-action">Exportera JSON</button>
            <label for="import-file" class="file-label">Importera JSON</label>
            <input type="file" id="import-file" accept=".json" />
            <button id="clear-db-btn" class="btn-action btn-danger">Rensa Databas</button>
        </div>
        <textarea id="editor" class="text-input" rows="10" placeholder="Börja skriva här..."></textarea>
        <div class="stats-container">
            <div class="stat-card">
                <span class="stat-label">Ord / Sekund</span>
                <div id="wps" class="stat-value">0.0</div>
            </div>
            <div class="stat-card">
                <div id="wpm" class="stat-value">0</div>
                <span class="stat-label">Ord / Minut</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Antal Pauser</span>
                <div id="pause-count" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <span class="stat-label">Snittpaus (sek)</span>
                <div id="pause-avg" class="stat-value">0.0</div>
            </div>
            <div class="stat-card">
                <button id="reset-btn" class="btn-reset">Återställ</button>
            </div>
        </div>
        <div class="chart-section">
            <div class="history-title">Diagram (WPM)</div>
            <div id="chart" class="chart-container"></div>
        </div>
        <div class="history-container">
            <div class="history-title">Resultat &amp; Jämförelse</div>
            <div class="table-wrapper">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th data-sort="username">Användare</th>
                            <th data-sort="wpm">WPM</th>
                            <th data-sort="wps">WPS</th>
                            <th data-sort="pauses">Pauser</th>
                            <th data-sort="pauseAvg">Snittpaus</th>
                            <th data-sort="rawTimestamp">Datum</th>
                        </tr>
                    </thead>
                    <tbody id="history-rows"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        const editor = document.getElementById('editor');
        const wpsDisplay = document.getElementById('wps');
        const wpmDisplay = document.getElementById('wpm');
        const pauseCountDisplay = document.getElementById('pause-count');
        const pauseAvgDisplay = document.getElementById('pause-avg');
        const resetBtn = document.getElementById('reset-btn');
        const usernameInput = document.getElementById('username');
        const exportBtn = document.getElementById('export-btn');
        const importFileInput = document.getElementById('import-file');
        const clearDbBtn = document.getElementById('clear-db-btn');
        const historyRows = document.getElementById('history-rows');
        const chartContainer = document.getElementById('chart');

        let totalWords = 0;
        let activeTime = 0;
        let isTyping = false;
        let timerInterval = null;
        let lastKeyTime = Date.now();
        let pauseStartTime = null;
        let pauses = [];
        let previousLength = 0;
        let db = null;
        let currentSortKey = 'rawTimestamp';
        let currentSortOrder = 'desc';

        const request = indexedDB.open('TypingStatsDB', 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains('results')) {
                db.createObjectStore('results', { keyPath: 'id', autoIncrement: true });
            }
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            loadHistory();
        };

        editor.addEventListener('paste', (e) => {
            e.preventDefault();
        });

        const countWords = (text) => {
            const cleanText = text.trim();
            if (!cleanText) return 0;
            return cleanText.split(/\s+/).filter(token => token.length > 0).length;
        };

        const updateStats = () => {
            const seconds = activeTime || 1;
            const minutes = seconds / 60;
            const wps = (totalWords / seconds).toFixed(1);
            const wpm = Math.round(totalWords / minutes);
            wpsDisplay.textContent = wps;
            wpmDisplay.textContent = wpm;
        };
        const saveResult = () => {
            const username = usernameInput.value.trim();
            if (!username || totalWords === 0) return;

            const seconds = activeTime || 1;
            const minutes = seconds / 60;
            const wps = parseFloat((totalWords / seconds).toFixed(1));
            const wpm = Math.round(totalWords / minutes);
            const totalPauseTime = pauses.reduce((a, b) => a + b, 0);
            const pauseAvg = pauses.length ? parseFloat((totalPauseTime / pauses.length).toFixed(1)) : 0.0;

            const record = {
                username,
                wps,
                wpm,
                pauses: pauses.length,
                pauseAvg,
                timestamp: new Date().toLocaleString(),
                rawTimestamp: Date.now()
            };

            const transaction = db.transaction(['results'], 'readwrite');
            const store = transaction.objectStore(['results']);
            store.add(record);
            transaction.oncomplete = () => {
                loadHistory();
            };
        };

        const startTimer = () => {
            if (timerInterval) return;
            isTyping = true;
            timerInterval = setInterval(() => {
                const now = Date.now();
                const idleTime = now - lastKeyTime;

                if (idleTime > 500) {
                    if (isTyping) {
                        isTyping = false;
                        pauseStartTime = lastKeyTime + 500;
                    }
                } else {
                    if (!isTyping) {
                        isTyping = true;
                        if (pauseStartTime) {
                            const pauseDuration = (now - pauseStartTime) / 1000;
                            pauses.push(pauseDuration);
                            pauseStartTime = null;
                            
                            pauseCountDisplay.textContent = pauses.length;
                            const totalPauseTime = pauses.reduce((a, b) => a + b, 0);
                            pauseAvgDisplay.textContent = (totalPauseTime / pauses.length).toFixed(1);
                        }
                    }
                    activeTime++;
                    updateStats();
                }
            }, 1000);
        };

        editor.addEventListener('input', (e) => {
            const currentText = editor.value;
            const currentLength = currentText.length;
            lastKeyTime = Date.now();

            if (currentLength < previousLength) {
                if (isTyping) {
                    isTyping = false;
                    pauseStartTime = lastKeyTime;
                }
                previousLength = currentLength;
                return;
            }

            previousLength = currentLength;
            totalWords = countWords(currentText);

            if (!timerInterval) {
                startTimer();
            }
        });
        const renderChart = (records) => {
            chartContainer.innerHTML = '';
            if (records.length === 0) return;
            const chartData = [...records].sort((a, b) => a.rawTimestamp - b.rawTimestamp).slice(-15);
            const maxWpm = Math.max(...chartData.map(r => r.wpm), 10);
            
            chartData.forEach(record => {
                const bar = document.createElement('div');
                bar.className = 'chart-bar';
                const heightPercent = (record.wpm / maxWpm) * 100;
                bar.style.height = `${heightPercent}%`;
                
                const tooltip = document.createElement('div');
                tooltip.className = 'chart-tooltip';
                tooltip.innerHTML = `${record.username}<br>WPM: ${record.wpm}<br>${record.timestamp.split(' ')[0]}`;
                
                bar.appendChild(tooltip);
                chartContainer.appendChild(bar);
            });
        };

        const loadHistory = () => {
            if (!db) return;
            const transaction = db.transaction(['results'], 'readonly');
            const store = transaction.objectStore('results');
            store.getAll().onsuccess = (e) => {
                let records = e.target.result;
                renderChart(records);

                records.sort((a, b) => {
                    let valA = a[currentSortKey];
                    let valB = b[currentSortKey];
                    if (typeof valA === 'string') {
                        return currentSortOrder === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                    }
                    return currentSortOrder === 'asc' ? valA - valB : valB - valA;
                });

                historyRows.innerHTML = '';
                records.forEach(record => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${record.username}</strong></td>
                        <td>${record.wpm}</td>
                        <td>${record.wps}</td>
                        <td>${record.pauses}</td>
                        <td>${record.pauseAvg}s</td>
                        <td><small>${record.timestamp}</small></td>
                    `;
                    historyRows.appendChild(row);
                });
            };
        };

        document.querySelectorAll('.history-table th').forEach(th => {
            th.addEventListener('click', () => {
                const sortKey = th.getAttribute('data-sort');
                if (currentSortKey === sortKey) {
                    currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSortKey = sortKey;
                    currentSortOrder = 'desc';
                }
                loadHistory();
            });
        });

        exportBtn.addEventListener('click', () => {
            const transaction = db.transaction(['results'], 'readonly');
            const store = transaction.objectStore('results');
            store.getAll().onsuccess = (e) => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(e.target.result));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", "skrivstatistik_export.json");
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };
        });

        importFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const importedData = JSON.parse(event.target.result);
                    if (Array.isArray(importedData)) {
                        const transaction = db.transaction(['results'], 'readwrite');
                        const store = transaction.objectStore(['results']);
                        importedData.forEach(item => {
                            delete item.id;
                            if(!item.rawTimestamp) item.rawTimestamp = Date.now();
                            store.add(item);
                        });
                        transaction.oncomplete = () => {
                            loadHistory();
                            importFileInput.value = '';
                        };
                    }
                } catch (err) {
                    alert('Felaktigt JSON-format.');
                }
            };
            reader.readAsText(file);
        });

        clearDbBtn.addEventListener('click', () => {
            if (confirm('Är du säker på att du vill rensa hela historiken?')) {
                const transaction = db.transaction(['results'], 'readwrite');
                store = transaction.objectStore(['results']);
                store.clear();
                transaction.oncomplete = () => {
                    loadHistory();
                };
            }
        });

        resetBtn.addEventListener('click', () => {
            saveResult();
            clearInterval(timerInterval);
            timerInterval = null;
            totalWords = 0;
            activeTime = 0;
            isTyping = false;
            lastKeyTime = Date.now();
            pauseStartTime = null;
            pauses = [];
            previousLength = 0;
            editor.value = '';
            wpsDisplay.textContent = '0.0';
            wpmDisplay.textContent = '0';
            pauseCountDisplay.textContent = '0';
            pauseAvgDisplay.textContent = '0.0';
        });
    </script>
</body>
</html>
