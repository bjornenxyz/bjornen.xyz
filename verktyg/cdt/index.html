<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nedräkningstimer</title>
  <style>
    :root{
      --bg:#0f172a;--panel:#111827;--text:#e5e7eb;--muted:#94a3b8;--line:#243044;
      --green:#22c55e;--orange:#f59e0b;--red:#ef4444;--btn:#1f2937;--btn2:#0b1220;
      --shadow:0 12px 40px rgba(0,0,0,.28)
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,var(--bg),#020617 70%);
      color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px
    }
    .app{width:min(960px,100%);background:rgba(17,24,39,.92);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
    h1{margin:0 0 16px;font-size:clamp(1.4rem,3vw,2rem)}
    .controls{display:grid;gap:12px}
    .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .unit{background:var(--btn2);border:1px solid var(--line);border-radius:16px;padding:10px;min-width:0}
    .unit label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:8px}
    .stepper{
      display:grid;
      grid-template-columns:40px minmax(0,1fr) 40px;
      gap:8px;
      align-items:center;
      width:100%;
      min-width:0;
    }
    .stepper button,.actions button,.actions select{
      height:44px;border:1px solid var(--line);border-radius:12px;background:var(--btn);color:var(--text);font:inherit
    }
    .stepper button,.actions button{cursor:pointer}
    .stepper input{
      width:100%;
      min-width:0;
      height:44px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#0b1220;
      color:#fff;
      text-align:center;
      font:inherit;
      appearance:textfield;
      padding:0 10px;
      position:relative;
      z-index:2;
      opacity:1;
      -webkit-text-fill-color:#fff;
    }
    .stepper input:focus{outline:2px solid #60a5fa;outline-offset:1px}
    .stepper input::selection{background:#2563eb;color:#fff}
    input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{appearance:none;margin:0}
    .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .actions button,.actions select{padding:0 14px}
    .actions button.primary{background:#2563eb;border-color:#3b82f6}
    .display{margin-top:18px;display:grid;gap:16px;justify-items:center}
    .mode-circle .countdown{width:min(360px,78vw);aspect-ratio:1;display:grid;place-items:center}
    .circle{
      width:100%;height:100%;border-radius:50%;
      background:conic-gradient(var(--fill) calc(var(--p)*1%),#1f2937 0);
      display:grid;place-items:center;padding:14px
    }
    .circle > div{
      width:100%;height:100%;border-radius:50%;background:#0b1220;border:1px solid var(--line);
      display:grid;place-items:center;text-align:center;padding:24px
    }
    .time{font-size:clamp(1.6rem,5vw,3rem);font-weight:700}
    .meta{color:var(--muted);margin-top:6px}
    .mode-flexgrid .countdown{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
    .tile{
      background:#0b1220;border:1px solid var(--line);border-radius:18px;padding:16px;min-height:96px;
      display:grid;place-items:center;text-align:center
    }
    .tile b{font-size:clamp(1.2rem,4vw,2rem);display:block}
    .tile span{color:var(--muted);font-size:.9rem}
    @media (max-width:900px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:640px){
      .app{padding:16px;border-radius:20px}
      .actions{flex-direction:column;align-items:stretch}
      .actions button,.actions select{width:100%}
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Nedräkningstimer</h1>

    <section class="controls">
      <div class="row">
        <div class="unit"><label>Dag</label><div class="stepper"><button type="button" data-step="-1" data-unit="d">−</button><input id="d" type="number" min="0" value="0"><button type="button" data-step="1" data-unit="d">+</button></div></div>
        <div class="unit"><label>Timmar</label><div class="stepper"><button type="button" data-step="-1" data-unit="h">−</button><input id="h" type="number" min="0" value="0"><button type="button" data-step="1" data-unit="h">+</button></div></div>
        <div class="unit"><label>Minuter</label><div class="stepper"><button type="button" data-step="-1" data-unit="m">−</button><input id="m" type="number" min="0" value="0"><button type="button" data-step="1" data-unit="m">+</button></div></div>
        <div class="unit"><label>Sekunder</label><div class="stepper"><button type="button" data-step="-1" data-unit="s">−</button><input id="s" type="number" min="0" value="0"><button type="button" data-step="1" data-unit="s">+</button></div></div>
      </div>

      <div class="actions">
        <select id="mode">
          <option value="circle">Cirkel</option>
          <option value="flexgrid">Grid</option>
        </select>
        <button type="button" class="primary" id="start">Starta</button>
        <button type="button" id="reset">Återställ</button>
      </div>
    </section>

    <section class="display mode-circle" id="display">
      <div class="countdown" id="countdown"></div>
      <div class="status" id="status"></div>
    </section>
  </main>

  <script>
    const els = {
      d: document.getElementById('d'),
      h: document.getElementById('h'),
      m: document.getElementById('m'),
      s: document.getElementById('s'),
      mode: document.getElementById('mode'),
      start: document.getElementById('start'),
      reset: document.getElementById('reset'),
      display: document.getElementById('display'),
      countdown: document.getElementById('countdown'),
      status: document.getElementById('status')
    };

    const units = {
      d: 24 * 60 * 60 * 1000,
      h: 60 * 60 * 1000,
      m: 60 * 1000,
      s: 1000
    };

    let target = 0, timer = null, total = 0;

    const clampInt = v => Math.max(0, parseInt(v || 0, 10) || 0);
    const sumMs = () => Object.entries(units).reduce((a, [k, ms]) => a + clampInt(els[k].value) * ms, 0);

    const fmt = ms => {
      ms = Math.max(0, ms);
      const s = Math.floor(ms / 1000);
      const d = Math.floor(s / 86400); let r = s % 86400;
      const h = Math.floor(r / 3600); r %= 3600;
      const m = Math.floor(r / 60); r %= 60;
      return { d, h, m, s: r };
    };

    const color = p => p > 0.66 ? getComputedStyle(document.documentElement).getPropertyValue('--green').trim()
      : p > 0.33 ? getComputedStyle(document.documentElement).getPropertyValue('--orange').trim()
      : getComputedStyle(document.documentElement).getPropertyValue('--red').trim();

    const render = () => {
      const left = target - Date.now();
      const p = total ? Math.max(0, Math.min(1, left / total)) : 0;
      const c = color(p);
      const t = fmt(left);
      els.countdown.innerHTML = els.mode.value === 'circle'
        ? `<div class="circle" style="--p:${p * 100};--fill:${c}"><div><div class="time">${String(t.d).padStart(2,'0')}:${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}:${String(t.s).padStart(2,'0')}</div><div class="meta">${left <= 0 ? 'Klart' : 'Pågår'}</div></div></div>`
        : ['d','h','m','s'].map(k => `<div class="tile" style="border-color:${c}66"><div><b>${t[k]}</b><span>${k==='d'?'Dag':k==='h'?'Timmar':k==='m'?'Minuter':'Sekunder'}</span></div></div>`).join('');
      els.status.textContent = left <= 0 ? '' : '';
      if (left <= 0) stop();
    };

    const stop = () => { clearInterval(timer); timer = null; };

    const start = () => {
      total = sumMs();
      if (!total) return;
      target = Date.now() + total;
      stop();
      render();
      timer = setInterval(render, 250);
    };

    const reset = () => {
      stop();
      target = 0; total = 0;
      Object.values(els).filter(e => e && e.type === 'number').forEach(i => i.value = 0);
      els.countdown.innerHTML = '';
      els.status.textContent = 'Ange tid för att starta nedräkningen.';
    };

    document.addEventListener('click', e => {
      const b = e.target.closest('button[data-step]');
      if (!b) return;
      const i = els[b.dataset.unit];
      i.value = clampInt(i.value) + Number(b.dataset.step);
      i.dispatchEvent(new Event('input', { bubbles: true }));
    });

    Object.values(els).forEach(el => {
      if (el && el.type === 'number') {
        el.addEventListener('input', () => {
          el.value = String(clampInt(el.value));
        });
      }
    });

    els.mode.addEventListener('change', () => {
      els.display.className = `display mode-${els.mode.value}`;
      if (target) render();
    });

    els.start.addEventListener('click', start);
    els.reset.addEventListener('click', reset);
    reset();
  </script>
</body>
</html>
