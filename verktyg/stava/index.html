<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rättstavningskontroll</title>
<style>
:root {
--bg-color: #121212;
--container-bg: #1e1e1e;
--text-color: #e0e0e0;
--text-secondary: #aaaaaa;
--accent-color: #bb86fc;
--success-color: #4caf50;
--border-color: #333333;
}

* {box-sizing: border-box;}

body {
background-color: var(--bg-color);
color: var(--text-color);
font-family: system-ui, sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100dvh;
margin: 0;
}
#app {
background-color: var(--container-bg);
padding: 2.5rem;
border-radius: 12px;
box-shadow: 0 8px 24px rgba(0,0,0,0.5);
width: 100%;
max-width: 480px;
text-align: center;
box-sizing: border-box;
}
#status-bar {
display: flex;
justify-content: space-between;
margin-bottom: 1.5rem;
font-size: 0.9rem;
color: var(--text-secondary);
text-transform: uppercase;
letter-spacing: 1px;
}
#lang-indicator {
font-size: 0.8rem;
background: #333;
padding: 4px 8px;
border-radius: 4px;
display: inline-block;
margin-bottom: 1rem;
color: #fff;
text-transform: uppercase;
}
#wrong-words-container {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-bottom: 2rem;
}
.wrong-word-card {
background-color: rgba(255,255,255,0.05);
padding: 0.8rem;
border-radius: 6px;
border: 1px solid var(--border-color);
font-size: 1.1rem;
color: green;
}
#input-container {
position: relative;
margin-bottom: 1.5rem;
display: flex;
align-items: center;
}
#user-input {
width: 100%;
padding: 12px 40px 12px 16px;
font-size: 1.2rem;
background-color: #2d2d2d;
border: 2px solid var(--border-color);
border-radius: 6px;
color: #fff;
outline: none;
transition: border-color 0.3s;
}
#user-input:focus {
border-color: var(--accent-color);
}
#feedback-icon {
position: absolute;
right: 12px;
font-size: 1.5rem;
display: none;
line-height: 1;
}
#feedback-icon.valid {
color: var(--success-color);
display: block;
}
button {
background-color: var(--accent-color);
color: #121212;
border: none;
padding: 12px 24px;
font-size: 1rem;
font-weight: bold;
border-radius: 6px;
cursor: pointer;
width: 100%;
transition: opacity 0.2s;
}
button:hover {
opacity: 0.9;
}
.hidden {
display: none !important;
}
</style>
</head>
<body>
<div id="app">
<div id="game-screen">
<div id="status-bar">
<span id="level-display">Nivå: 1</span>
<span id="score-display">Poäng: 0</span>
</div>
<div id="lang-indicator"></div>
<h2 id="title">Stava ordet korrekt</h2>
<div id="wrong-words-container"></div>
<div id="input-container">
<input type="text" id="user-input" autocomplete="off" placeholder="Skriv ditt svar här...">
<span id="feedback-icon"></span>
</div>
<button id="next-btn" class="hidden">Nästa ord</button>
</div>
<div id="end-screen" class="hidden">
<h2>Grattis!</h2>
<p id="final-message"></p>
<button id="restart-btn">Spela igen</button>
</div>
</div>
<script>
let allWords = [];
let currentWordsPool = [];
let currentWordIndex = 0;
let currentLevel = 1;
let score = 0;
const gameScreen = document.getElementById('game-screen');
const endScreen = document.getElementById('end-screen');
const userInput = document.getElementById('user-input');
const feedbackIcon = document.getElementById('feedback-icon');
const nextBtn = document.getElementById('next-btn');
const wrongContainer = document.getElementById('wrong-words-container');
const levelDisplay = document.getElementById('level-display');
const scoreDisplay = document.getElementById('score-display');
const langIndicator = document.getElementById('lang-indicator');
const finalMessage = document.getElementById('final-message');
const restartBtn = document.getElementById('restart-btn');
const skipBtn = document.createElement('button');
skipBtn.id = 'skip-btn';
skipBtn.textContent = 'Hoppa över (-' + currentLevel + ' poäng)';
skipBtn.style.marginTop = '10px';
skipBtn.style.backgroundColor = '#cf6679';
nextBtn.parentNode.insertBefore(skipBtn, nextBtn.nextSibling);
async function loadGame() {
try {
const response = await fetch('words.json');
allWords = await response.json();
initLevel();
} catch (error) {
console.error(error);
}}
function initLevel() {
currentWordsPool = allWords.filter(w => w.level === currentLevel);
if (currentWordsPool.length === 0) {
showEndScreen();
return;
}
currentWordsPool.sort(() => Math.random() - 0.5);
currentWordIndex = 0;
levelDisplay.textContent = `Nivå: ${currentLevel}`;
showWord();
}
function showWord() {
userInput.value = '';
userInput.disabled = false;
feedbackIcon.className = '';
feedbackIcon.textContent = '';
nextBtn.classList.add('hidden');
skipBtn.textContent = `Hoppa över (-${currentLevel} poäng)`;
updateSkipButtonState();
const currentData = currentWordsPool[currentWordIndex];
langIndicator.textContent = currentData.lang === 'sv' ? 'Svenska' : 'Engelska';
wrongContainer.innerHTML = '';
const mixedWrong = [...currentData.wrong].sort(() => Math.random() - 0.5);
mixedWrong.forEach(w => {
const card = document.createElement('div');
card.className = 'wrong-word-card';
card.textContent = w;
wrongContainer.appendChild(card);
});
userInput.focus();
}
function updateSkipButtonState() {
if (score >= currentLevel) {
skipBtn.disabled = false;
skipBtn.style.opacity = '1';
skipBtn.style.cursor = 'pointer';
} else {
skipBtn.disabled = true;
skipBtn.style.opacity = '0.4';
skipBtn.style.cursor = 'not-allowed';
}}
userInput.addEventListener('input', () => {
const currentData = currentWordsPool[currentWordIndex];
if (userInput.value.trim().toLowerCase() === currentData.correct.toLowerCase()) {
userInput.disabled = true;
feedbackIcon.textContent = '✓';
feedbackIcon.className = 'valid';
score += currentLevel;
scoreDisplay.textContent = `Poäng: ${score}`;
nextBtn.classList.remove('hidden');
skipBtn.classList.add('hidden');
nextBtn.focus();
}});
nextBtn.addEventListener('click', () => {
skipBtn.classList.remove('hidden');
currentWordIndex++;
if (currentWordIndex < currentWordsPool.length) {
showWord();
} else {
currentLevel++;
initLevel();
}});
skipBtn.addEventListener('click', () => {
if (score >= currentLevel) {
score -= currentLevel;
scoreDisplay.textContent = `Poäng: ${score}`;
currentWordIndex++;
if (currentWordIndex < currentWordsPool.length) {
showWord();
} else {
currentLevel++;
initLevel();
}}});
function showEndScreen() {
gameScreen.classList.add('hidden');
endScreen.classList.remove('hidden');
skipBtn.classList.add('hidden');
finalMessage.textContent = `Grattis! Spelet är slut. Din poäng blev ${score}.`;
}
restartBtn.addEventListener('click', () => {
currentLevel = 1;
score = 0;
scoreDisplay.textContent = `Poäng: ${score}`;
endScreen.classList.add('hidden');
gameScreen.classList.remove('hidden');
skipBtn.classList.remove('hidden');
initLevel();
});
window.addEventListener('DOMContentLoaded', loadGame);
</script>
</body>
</html>
