<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teknisk Quiz</title>
<style>
:root {
--primary: #3498db;
--primary-dark: #2980b9;
--secondary: #2ecc71;
--success: #27ae60;
--danger: #e74c3c;
--light: #ecf0f1;
--dark: #2c3e50;
--white: #ffffff;
--transition: all 0.3s ease;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
background-color: var(--light);
color: var(--dark);
line-height: 1.6;
padding: 20px;
}

.quiz-container {
max-width: 800px;
margin: 0 auto;
background: var(--white);
border-radius: 10px;
box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
overflow: hidden;
}

.quiz-header {
background: var(--primary);
color: var(--white);
padding: 20px;
text-align: center;
}

.quiz-progress {
background: var(--light);
padding: 15px;
text-align: center;
font-size: 1.2rem;
font-weight: bold;
}

.quiz-question {
padding: 30px;
display: none;

&.active {
display: block;
}
}

.question-text {
font-size: 1.3rem;
margin-bottom: 20px;
text-align: center;
}

.options {
display: flex;
flex-direction: column;
gap: 15px;

.option {
background: var(--light);
border: 2px solid transparent;
border-radius: 8px;
padding: 15px;
cursor: pointer;
transition: var(--transition);
font-size: 1rem;

&:hover {
background: rgba(52, 152, 219, 0.1);
}

&.correct {
background: rgba(46, 204, 113, 0.2);
border-color: var(--success);
}

&.incorrect {
background: rgba(231, 76, 60, 0.2);
border-color: var(--danger);
}
}
}

.quiz-result {
padding: 30px;
text-align: center;
display: none;

.result-header {
font-size: 1.5rem;
margin-bottom: 20px;
color: var(--primary);
}

.result-score {
font-size: 2rem;
font-weight: bold;
margin-bottom: 20px;
}

.result-details {
text-align: left;
margin-top: 30px;
}

.result-question {
margin-bottom: 20px;
padding-bottom: 20px;
border-bottom: 1px solid var(--light);

&:last-child {
border-bottom: none;
}
}

.result-question-text {
font-weight: bold;
margin-bottom: 10px;
}

.result-answer {
padding: 10px;
border-radius: 5px;
margin-bottom: 5px;

&.result-correct {
background: rgba(46, 204, 113, 0.2);
border-left: 4px solid var(--success);
}

&.result-incorrect {
background: rgba(231, 76, 60, 0.2);
border-left: 4px solid var(--danger);
}
}

.correct-answer {
font-weight: bold;
margin-top: 10px;
color: var(--success);
}
}

.btn {
background: var(--primary);
color: var(--white);
border: none;
padding: 12px 25px;
border-radius: 5px;
cursor: pointer;
font-size: 1rem;
transition: var(--transition);
margin-top: 20px;

&:hover {
background: var(--primary-dark);
}

&:disabled {
background: #95a5a6;
cursor: not-allowed;
}
}

@media (max-width: 600px) {
.quiz-container {
padding: 10px;
}
.quiz-question {
padding: 20px;
}
.question-text {
font-size: 1.1rem;
}
}
</style>
</head>
<body>
<div class="quiz-container">
<div class="quiz-header">
<h1>Dev Quiz</h1>
</div>

<div class="quiz-progress" id="progress">Fråga 1 av 20</div>

<div class="quiz-question active" id="quiz-question">
<div class="question-text" id="question-text"></div>
<div class="options" id="options"></div>
</div>

<div class="quiz-result" id="result">
<div class="result-header">Quizet är klart!</div>
<div class="result-score" id="score">0 av 20</div>
<button class="btn" id="restart-btn">Gör om quizet</button>
<div class="result-details" id="result-details"></div>
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
const questions = [
{ category: 'HTML', text: 'Vilken HTML-tagg används för att skapa en länk?', options: ['div', 'a', 'link', 'href'], answer: 1 },
{ category: 'HTML', text: 'Vad är rätt syntax för att definiera en CSS-klass?', options: ['.klass { }', '#klass { }', 'klass { }', 'klass: { }'], answer: 0 },
{ category: 'HTML', text: 'Vilken HTML-attribut används för att göra ett input-fält obligatoriskt?', options: ['required', 'mandatory', 'validate', 'must'], answer: 0 },
{ category: 'HTML', text: 'Vilken HTML-tagg används för att skapa en oordnad lista?', options: ['<ul>', '<ol>', '<li>', '<list>'], answer: 0 },
{ category: 'HTML', text: 'Vad är korrekt syntax för att skapa en bildlänk i HTML?', options: ['<a href="url"><img src="bild.jpg"></a>', '<img src="bild.jpg"><a href="url"></a>', '<a href="url"><img></a>', '<img><a href="url">bild.jpg</a>'], answer: 0 },
{ category: 'CSS', text: 'Vilken CSS-egenskap används för att ändra textens färg?', options: ['text-color', 'font-color', 'color', 'text-style'], answer: 2 },
{ category: 'CSS', text: 'Vad är rätt syntax för att definiera en CSS-klass?', options: ['.klass { }', '#klass { }', 'klass { }', 'klass: { }'], answer: 0 },
{ category: 'CSS', text: 'Vilken CSS-egenskap används för att skapa en skugga bakom ett element?', options: ['shadow', 'box-shadow', 'element-shadow', 'background-shadow'], answer: 1 },
{ category: 'CSS', text: 'Vad gör CSS-egenskapen display: flex?', options: ['Gör elementet osynligt', 'Skapar en flexcontainer', 'Ändrar textens färg', 'Skapar en rundad kant'], answer: 1 },
{ category: 'CSS', text: 'Vilken CSS-egenskap används för att ändra elementets positionering?', options: ['display', 'position', 'layout', 'float'], answer: 1 },
{ category: 'JavaScript', text: 'Vilken metod används för att lägga till ett element i slutet av en array i JavaScript?', options: ['push()', 'pop()', 'shift()', 'unshift()'], answer: 0 },
{ category: 'JavaScript', text: 'Vad returnerar följande kod: typeof null?', options: ['"null"', '"object"', '"undefined"', '"number"'], answer: 1 },
{ category: 'JavaScript', text: 'Vad är korrekt syntax för att deklarera en funktion i JavaScript?', options: ['function myFunc() { }', 'def myFunc(): ', 'func myFunc() { }', 'myFunc = function() { }'], answer: 0 },
{ category: 'JavaScript', text: 'Vad är skillnaden mellan == och === i JavaScript?', options: ['== jämför värde och typ, === jämför endast värde', '== jämför endast värde, === jämför värde och typ', 'Båda jämför värde och typ', 'Båda jämför endast värde'], answer: 1 },
{ category: 'JavaScript', text: 'Vad gör följande JavaScript-kod: [1, 2, 3].map(x => x * 2);', options: ['Skapar en ny array med värdena 2, 4, 6', 'Filtrerar arrayen och returnerar endast jämna tal', 'Returnerar det första elementet multiplicerat med 2', 'Returnerar arrayens längd multiplicerat med 2'], answer: 0 },
{ category: 'Backend', text: 'Vilken HTTP-metod används normalt för att skicka data till en server för att skapa en ny resurs?', options: ['GET', 'POST', 'PUT', 'DELETE'], answer: 1 },
{ category: 'Backend', text: 'Vad är korrekt syntax för att importera en modul i JavaScript?', options: ['import module from \'module.js\'', 'require(\'module.js\')', 'include \'module.js\'', 'load module from \'module.js\''], answer: 0 },
{ category: 'Backend', text: 'Vilken HTTP-statuskod indikerar att en resurs har flyttats permanent?', options: ['200', '301', '404', '500'], answer: 1 },
{ category: 'Backend', text: 'Vad är korrekt syntax för att skapa en Promise i JavaScript?', options: ['new Promise((resolve, reject) => { }) ', 'Promise((resolve, reject) => { }) ', 'create Promise((resolve, reject) => { }) ', 'make Promise((resolve, reject) => { }) '], answer: 0 },
{ category: 'Backend', text: 'Vad är korrekt syntax för att skapa en klass i ES6 JavaScript?', options: ['class MyClass { }', 'def MyClass: ', 'function MyClass() { }', 'object MyClass { }'], answer: 0 }
];

let currentQuestion = 0;
let score = 0;
let userAnswers = [];
let quizCompleted = false;
let shuffledQuestions = [];

const progressElement = document.getElementById('progress');
const questionTextElement = document.getElementById('question-text');
const optionsContainer = document.getElementById('options');
const resultContainer = document.getElementById('result');
const scoreElement = document.getElementById('score');
const resultDetails = document.getElementById('result-details');
const restartBtn = document.getElementById('restart-btn');

function shuffleArray(array) {
for (let i = array.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[array[i], array[j]] = [array[j], array[i]];
}
return array;
}

function shuffleQuestions() {
const categories = ['HTML', 'CSS', 'JavaScript', 'Backend'];
let combined = [];
categories.forEach(cat => {
const filtered = questions.filter(q => q.category === cat);
combined = combined.concat(shuffleArray([...filtered]));
});
return combined;
}

function showQuestion(index) {
const question = shuffledQuestions[index];
progressElement.textContent = `Fråga ${index + 1} av ${shuffledQuestions.length}`;
questionTextElement.textContent = question.text;
optionsContainer.innerHTML = '';

question.options.forEach((option, i) => {
const optionElement = document.createElement('div');
optionElement.className = 'option';
optionElement.textContent = option;
optionElement.addEventListener('click', () => selectAnswer(index, i));
optionsContainer.appendChild(optionElement);
});

document.getElementById('quiz-question').classList.add('active');
}

function selectAnswer(questionIndex, selectedIndex) {
if (quizCompleted) return;
const question = shuffledQuestions[questionIndex];
userAnswers[questionIndex] = selectedIndex;

const options = optionsContainer.querySelectorAll('.option');
options.forEach((option, i) => {
option.style.pointerEvents = 'none';
if (i === question.answer) {
option.classList.add('correct');
} else if (i === selectedIndex) {
option.classList.add('incorrect');
}
});

if (selectedIndex === question.answer) {
score++;
}

setTimeout(() => {
currentQuestion++;
if (currentQuestion < shuffledQuestions.length) {
showQuestion(currentQuestion);
} else {
showResult();
}
}, 2000);
}

function showResult() {
quizCompleted = true;
document.getElementById('quiz-question').classList.remove('active');
resultContainer.style.display = 'block';
scoreElement.textContent = `${score} av ${shuffledQuestions.length}`;
resultDetails.innerHTML = '';

shuffledQuestions.forEach((question, index) => {
const resultQuestion = document.createElement('div');
resultQuestion.className = 'result-question';

const questionText = document.createElement('div');
questionText.className = 'result-question-text';
questionText.textContent = `Fråga ${index + 1}: ${question.text}`;
resultQuestion.appendChild(questionText);

const userAnswerIndex = userAnswers[index];
const correctAnswerIndex = question.answer;

question.options.forEach((option, i) => {
const answerElement = document.createElement('div');
answerElement.className = 'result-answer';

if (i === correctAnswerIndex) {
answerElement.classList.add('result-correct');
answerElement.textContent = `Rätt svar: ${option}`;
} else if (i === userAnswerIndex) {
answerElement.classList.add('result-incorrect');
answerElement.textContent = `Ditt svar: ${option}`;
} else {
answerElement.textContent = option;
}
resultQuestion.appendChild(answerElement);
});

resultDetails.appendChild(resultQuestion);
});
}

restartBtn.addEventListener('click', () => {
currentQuestion = 0;
score = 0;
userAnswers = [];
quizCompleted = false;
resultContainer.style.display = 'none';
shuffledQuestions = shuffleQuestions();
showQuestion(currentQuestion);
});

shuffledQuestions = shuffleQuestions();
showQuestion(currentQuestion);
});
</script>
</body>
</html>
